<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ide-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="50%" stop-color="#060914"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="ide-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00ff9d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="ide-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Inter:wght@600;700&amp;display=swap');
      .txt-code { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11px; }
      .txt-sans { font-family: 'Inter', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Main IDE Window Frame -->
  <rect width="520" height="470" rx="14" fill="url(#ide-bg)" stroke="url(#ide-border)" stroke-width="1.5" filter="url(#ide-glow)"/>

  <!-- Top Title Bar -->
  <path d="M 0,14 Q 0,0 14,0 L 506,0 Q 520,0 520,14 L 520,38 L 0,38 Z" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Window Control Buttons -->
  <circle cx="20" cy="19" r="5.5" fill="#ff5f56"/>
  <circle cx="36" cy="19" r="5.5" fill="#ffbd2e"/>
  <circle cx="52" cy="19" r="5.5" fill="#27c93f"/>

  <!-- Active Tab -->
  <g transform="translate(75, 8)">
    <rect width="165" height="30" rx="6 6 0 0" fill="#060914" stroke="#1e293b" stroke-width="1"/>
    <text class="txt-code" font-size="11" font-weight="600" fill="#00f3ff" x="14" y="19">🐍 RajivRamteke.py</text>
  </g>

  <!-- Live Compiling Badge with SMIL Pulse -->
  <g transform="translate(385, 19)">
    <circle cx="0" cy="0" r="4.5" fill="#00ff9d" filter="url(#ide-glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text class="txt-code" font-size="10" font-weight="700" fill="#00ff9d" x="12" y="4">LIVE COMPILING</text>
  </g>

  <!-- Breadcrumb Bar -->
  <g transform="translate(0, 38)">
    <rect width="520" height="22" fill="#090e1c"/>
    <text class="txt-code" font-size="9.5" fill="#64748b" x="14" y="15">src  ›  core  ›  <tspan fill="#38bdf8">RajivRamteke.py</tspan>  ›  <tspan fill="#00ff9d">class DeveloperProfile</tspan></text>
  </g>

  <!-- Line Number Margin -->
  <rect x="0" y="60" width="36" height="325" fill="#050812"/>
  <line x1="36" y1="60" x2="36" y2="385" stroke="#1e293b" stroke-width="1"/>

  <!-- Line Numbers (1 - 16) -->
  <g class="txt-code" fill="#475569" font-size="10.5" text-anchor="end">
    <text x="26" y="80">1</text>
    <text x="26" y="99">2</text>
    <text x="26" y="118">3</text>
    <text x="26" y="137">4</text>
    <text x="26" y="156">5</text>
    <text x="26" y="175">6</text>
    <text x="26" y="194">7</text>
    <text x="26" y="213">8</text>
    <text x="26" y="232">9</text>
    <text x="26" y="251">10</text>
    <text x="26" y="270">11</text>
    <text x="26" y="289">12</text>
    <text x="26" y="308">13</text>
    <text x="26" y="327">14</text>
    <text x="26" y="346">15</text>
    <text x="26" y="365">16</text>
  </g>

  <!-- Code Body (100% Crisp Visible Colors) -->
  <g class="txt-code" transform="translate(48, 0)">
    <!-- Line 1 -->
    <text y="80" fill="#64748b"># ═════════════════════════════════════════════</text>
    <!-- Line 2 -->
    <text y="99" fill="#64748b"># 👨‍💻 RAJIV G. RAMTEKE // IDENTITY MANIFEST</text>
    <!-- Line 3 -->
    <text y="118" fill="#64748b"># ═════════════════════════════════════════════</text>

    <!-- Line 4 -->
    <text y="137"><tspan fill="#f43f5e" font-weight="600">class</tspan> <tspan fill="#00ff9d" font-weight="700">DeveloperProfile</tspan><tspan fill="#f8fafc">:</tspan></text>

    <!-- Line 5 -->
    <text y="156"><tspan fill="#f43f5e" font-weight="600" x="14">def</tspan> <tspan fill="#38bdf8" font-weight="600" x="44">__init__</tspan><tspan fill="#f8fafc" x="98">(self):</tspan></text>

    <!-- Line 6 -->
    <text y="175"><tspan fill="#cbd5e1" x="28">self.name</tspan> <tspan fill="#f43f5e" x="100">=</tspan> <tspan fill="#00f3ff" x="115">"Rajiv G. Ramteke"</tspan></text>

    <!-- Line 7 -->
    <text y="194"><tspan fill="#cbd5e1" x="28">self.role</tspan> <tspan fill="#f43f5e" x="100">=</tspan> <tspan fill="#00f3ff" x="115">"Full-Stack &amp; AI Engineer"</tspan></text>

    <!-- Line 8 -->
    <text y="213"><tspan fill="#cbd5e1" x="28">self.college</tspan> <tspan fill="#f43f5e" x="100">=</tspan> <tspan fill="#00f3ff" x="115">"B.Tech CE (Computer Engineering) @ SCET Nagpur"</tspan></text>

    <!-- Line 9 -->
    <text y="232"><tspan fill="#cbd5e1" x="28">self.score</tspan> <tspan fill="#f43f5e" x="100">=</tspan> <tspan fill="#00ff9d" x="115">"SGPA: 8.74 / 10.0"</tspan></text>

    <!-- Line 10 -->
    <text y="251"><tspan fill="#cbd5e1" x="28">self.target</tspan> <tspan fill="#f43f5e" x="100">=</tspan> <tspan fill="#00f3ff" x="115">"SDE &amp; AI @ ImmverseAI"</tspan></text>

    <!-- Line 11 -->
    <text y="270"><tspan fill="#cbd5e1" x="28">self.node</tspan> <tspan fill="#f43f5e" x="100">=</tspan> <tspan fill="#00f3ff" x="115">"Nagpur, MH, India 🇮🇳"</tspan></text>

    <!-- Line 12 -->
    <text y="289"><tspan fill="#f43f5e" font-weight="600" x="14">def</tspan> <tspan fill="#38bdf8" font-weight="600" x="44">get_skills</tspan><tspan fill="#f8fafc" x="115">(self):</tspan></text>

    <!-- Line 13 -->
    <text y="308"><tspan fill="#f43f5e" font-weight="600" x="28">return</tspan> <tspan fill="#f8fafc" x="75">[</tspan><tspan fill="#00ff9d" x="83">"Python"</tspan><tspan fill="#f8fafc" x="138">,</tspan> <tspan fill="#00ff9d" x="148">"AI/ML"</tspan><tspan fill="#f8fafc" x="195">,</tspan> <tspan fill="#00ff9d" x="205">"OpenCV"</tspan><tspan fill="#f8fafc" x="260">,</tspan> <tspan fill="#00ff9d" x="270">"React"</tspan><tspan fill="#f8fafc" x="315">]</tspan></text>

    <!-- Line 14 -->
    <text y="327"><tspan fill="#f43f5e" font-weight="600" x="14">def</tspan> <tspan fill="#38bdf8" font-weight="600" x="44">contact</tspan><tspan fill="#f8fafc" x="98">(self):</tspan></text>

    <!-- Line 15 -->
    <text y="346"><tspan fill="#f43f5e" font-weight="600" x="28">return</tspan> <tspan fill="#00f3ff" x="75">"ramtekerajiv22@gmail.com"</tspan></text>

    <!-- Line 16 -->
    <text y="365" fill="#64748b"># Status: 100% Operational &amp; Ready! ⚡</text>
  </g>

  <!-- Bottom Integrated Terminal Panel -->
  <g transform="translate(0, 385)">
    <rect width="520" height="85" fill="#040710" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Terminal Header Bar -->
    <rect width="520" height="20" fill="#090e1a"/>
    <text class="txt-code" font-size="9" font-weight="700" fill="#94a3b8" x="12" y="14">TERMINAL OUTPUT // PYTHON 3.12 EXECUTION</text>

    <!-- Terminal Prompt & Live Output -->
    <text class="txt-code" font-size="10" x="12" y="38">
      <tspan fill="#00ff9d">root@rajiv-ramteke:~$</tspan> <tspan fill="#f8fafc">python3 -m rajiv.core --verify</tspan>
    </text>
    
    <text class="txt-code" font-size="9.5" fill="#38bdf8" x="12" y="55">[SYS_OK] Compiling Rajiv Ramteke Profile... Done (0.012s)</text>
    <text class="txt-code" font-size="9.5" fill="#00ff9d" x="12" y="70">&gt;&gt;&gt; System Ready. Open to Internships &amp; Hackathons! 🚀</text>

    <!-- SMIL Animated Neon Cursor -->
    <rect x="365" y="60" width="7" height="12" fill="#00f3ff" filter="url(#ide-glow)">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
