<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#00ff9d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Inter:wght@600;700&amp;display=swap');
      
      .code-font { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11.5px; }
      .sans-font { font-family: 'Inter', sans-serif; }

      /* Animated typing / line reveals */
      .line { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
      .l1  { animation-delay: 0.1s; }
      .l2  { animation-delay: 0.3s; }
      .l3  { animation-delay: 0.5s; }
      .l4  { animation-delay: 0.7s; }
      .l5  { animation-delay: 0.9s; }
      .l6  { animation-delay: 1.1s; }
      .l7  { animation-delay: 1.3s; }
      .l8  { animation-delay: 1.5s; }
      .l9  { animation-delay: 1.7s; }
      .l10 { animation-delay: 1.9s; }
      .l11 { animation-delay: 2.1s; }
      .l12 { animation-delay: 2.3s; }
      .l13 { animation-delay: 2.5s; }
      .l14 { animation-delay: 2.7s; }
      .l15 { animation-delay: 2.9s; }
      .l16 { animation-delay: 3.1s; }
      .l17 { animation-delay: 3.3s; }
      .l18 { animation-delay: 3.5s; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Blinking Cursor */
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor { animation: blinkCursor 0.8s infinite; fill: #00f3ff; }

      /* Pulsing Live Dot */
      @keyframes pulseDot {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .live-dot { animation: pulseDot 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Main Window Frame -->
  <rect width="520" height="470" rx="14" fill="url(#term-bg)" stroke="url(#term-border)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Window Header Bar -->
  <path d="M 0,14 Q 0,0 14,0 L 506,0 Q 520,0 520,14 L 520,38 L 0,38 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Window Control Buttons -->
  <circle cx="20" cy="19" r="5.5" fill="#ff5f56"/>
  <circle cx="36" cy="19" r="5.5" fill="#ffbd2e"/>
  <circle cx="52" cy="19" r="5.5" fill="#27c93f"/>

  <!-- Tab Title -->
  <g transform="translate(85, 10)">
    <rect width="160" height="28" rx="6" fill="#080e1a" stroke="#1e293b" stroke-width="1"/>
    <text class="code-font" font-size="11" fill="#38bdf8" x="12" y="18">🐍 rajiv_profile.py</text>
  </g>

  <g transform="translate(380, 19)">
    <circle class="live-dot" cx="0" cy="0" r="4" fill="#00ff9d" filter="url(#glow)"/>
    <text class="code-font" font-size="10" font-weight="600" fill="#00ff9d" x="10" y="4">LIVE EDITING</text>
  </g>

  <!-- Line Number Bar Backdrop -->
  <rect x="0" y="39" width="38" height="431" fill="#070b14"/>
  <line x1="38" y1="39" x2="38" y2="470" stroke="#1e293b" stroke-width="1"/>

  <!-- Line Numbers -->
  <g class="code-font" fill="#475569" font-size="11" text-anchor="end">
    <text x="28" y="65">1</text>
    <text x="28" y="86">2</text>
    <text x="28" y="107">3</text>
    <text x="28" y="128">4</text>
    <text x="28" y="149">5</text>
    <text x="28" y="170">6</text>
    <text x="28" y="191">7</text>
    <text x="28" y="212">8</text>
    <text x="28" y="233">9</text>
    <text x="28" y="254">10</text>
    <text x="28" y="275">11</text>
    <text x="28" y="296">12</text>
    <text x="28" y="317">13</text>
    <text x="28" y="338">14</text>
    <text x="28" y="359">15</text>
    <text x="28" y="380">16</text>
    <text x="28" y="401">17</text>
    <text x="28" y="422">18</text>
  </g>

  <!-- Code Body Lines -->
  <g class="code-font" transform="translate(50, 0)">
    <!-- Line 1 -->
    <g class="line l1" transform="translate(0, 65)">
      <text fill="#64748b"># ═════════════════════════════════════════════</text>
    </g>
    <!-- Line 2 -->
    <g class="line l2" transform="translate(0, 86)">
      <text fill="#64748b"># 👨‍💻 RAJIV G. RAMTEKE // IDENTITY MANIFEST</text>
    </g>
    <!-- Line 3 -->
    <g class="line l3" transform="translate(0, 107)">
      <text fill="#64748b"># ═════════════════════════════════════════════</text>
    </g>

    <!-- Line 4 -->
    <g class="line l4" transform="translate(0, 128)">
      <text fill="#f43f5e">class</text>
      <text fill="#00ff9d" x="42">DeveloperProfile</text>
      <text fill="#f8fafc" x="160">:</text>
    </g>

    <!-- Line 5 -->
    <g class="line l5" transform="translate(0, 149)">
      <text fill="#f43f5e" x="16">def</text>
      <text fill="#38bdf8" x="45">__init__</text>
      <text fill="#f8fafc" x="102">(self):</text>
    </g>

    <!-- Line 6 -->
    <g class="line l6" transform="translate(0, 170)">
      <text fill="#cbd5e1" x="32">self.name</text>
      <text fill="#f43f5e" x="110">=</text>
      <text fill="#00f3ff" x="125">"Rajiv G. Ramteke"</text>
    </g>

    <!-- Line 7 -->
    <g class="line l7" transform="translate(0, 191)">
      <text fill="#cbd5e1" x="32">self.role</text>
      <text fill="#f43f5e" x="110">=</text>
      <text fill="#00f3ff" x="125">"Full-Stack &amp; AI Engineer"</text>
    </g>

    <!-- Line 8 -->
    <g class="line l8" transform="translate(0, 212)">
      <text fill="#cbd5e1" x="32">self.college</text>
      <text fill="#f43f5e" x="110">=</text>
      <text fill="#00f3ff" x="125">"B.Tech CE (Computer Engineering) @ SCET Nagpur"</text>
    </g>

    <!-- Line 9 -->
    <g class="line l9" transform="translate(0, 233)">
      <text fill="#cbd5e1" x="32">self.score</text>
      <text fill="#f43f5e" x="110">=</text>
      <text fill="#00ff9d" x="125">"SGPA: 8.74 / 10.0"</text>
    </g>

    <!-- Line 10 -->
    <g class="line l10" transform="translate(0, 254)">
      <text fill="#cbd5e1" x="32">self.target</text>
      <text fill="#f43f5e" x="110">=</text>
      <text fill="#00f3ff" x="125">"SDE &amp; AI @ ImmverseAI"</text>
    </g>

    <!-- Line 11 -->
    <g class="line l11" transform="translate(0, 275)">
      <text fill="#cbd5e1" x="32">self.location</text>
      <text fill="#f43f5e" x="110">=</text>
      <text fill="#00f3ff" x="125">"Nagpur, MH, India 🇮🇳"</text>
    </g>

    <!-- Line 12 -->
    <g class="line l12" transform="translate(0, 296)">
      <text fill="#f43f5e" x="16">def</text>
      <text fill="#38bdf8" x="45">get_core_skills</text>
      <text fill="#f8fafc" x="155">(self):</text>
    </g>

    <!-- Line 13 -->
    <g class="line l13" transform="translate(0, 317)">
      <text fill="#f43f5e" x="32">return</text>
      <text fill="#f8fafc" x="80">[</text>
      <text fill="#00ff9d" x="88">"Python"</text>
      <text fill="#f8fafc" x="145">,</text>
      <text fill="#00ff9d" x="155">"AI/ML"</text>
      <text fill="#f8fafc" x="204">,</text>
      <text fill="#00ff9d" x="214">"OpenCV"</text>
      <text fill="#f8fafc" x="272">,</text>
      <text fill="#00ff9d" x="282">"Flask"</text>
      <text fill="#f8fafc" x="330">]</text>
    </g>

    <!-- Line 14 -->
    <g class="line l14" transform="translate(0, 338)">
      <text fill="#f43f5e" x="16">def</text>
      <text fill="#38bdf8" x="45">contact_me</text>
      <text fill="#f8fafc" x="125">(self):</text>
    </g>

    <!-- Line 15 -->
    <g class="line l15" transform="translate(0, 359)">
      <text fill="#f43f5e" x="32">return</text>
      <text fill="#00f3ff" x="80">"ramtekerajiv22@gmail.com"</text>
    </g>

    <!-- Line 16 -->
    <g class="line l16" transform="translate(0, 380)">
      <text fill="#64748b"># Status: 100% Operational &amp; Ready! ⚡</text>
    </g>

    <!-- Line 17 -->
    <g class="line l17" transform="translate(0, 401)">
      <text fill="#38bdf8">print</text>
      <text fill="#f8fafc" x="38">(</text>
      <text fill="#00ff9d" x="45">"Welcome to Rajiv's Profile! 🚀"</text>
      <text fill="#f8fafc" x="275">)</text>
    </g>

    <!-- Line 18 Animated Blinking Cursor -->
    <g class="line l18" transform="translate(0, 422)">
      <text fill="#00ff9d">&gt;&gt;&gt;</text>
      <rect class="cursor" x="30" y="-10" width="8" height="13" rx="1"/>
    </g>

  </g>

</svg>
