<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" width="100%" height="100%">
  <defs>
    <!-- Pipeline Gradients -->
    <linearGradient id="pipe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#040711" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="pipe-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="wire-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>

    <linearGradient id="node-box-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#070d18"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="pipe-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Fonts & Animations -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Inter:wght@600;700;800&amp;display=swap');
      .txt-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .txt-mono { font-family: 'JetBrains Mono', monospace; }

      @keyframes pulse-node {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .node-beacon { animation: pulse-node 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Plate Frame -->
  <rect width="1160" height="350" rx="20" fill="url(#pipe-bg)" stroke="url(#pipe-glass)" stroke-width="2" filter="url(#pipe-glow)"/>

  <!-- Subtle Circuit Grid Backdrop -->
  <g opacity="0.04" stroke="#00f3ff" stroke-width="1">
    <line x1="0" y1="50" x2="1160" y2="50"/>
    <line x1="0" y1="180" x2="1160" y2="180"/>
    <line x1="0" y1="300" x2="1160" y2="300"/>
    <line x1="290" y1="0" x2="290" y2="350"/>
    <line x1="580" y1="0" x2="580" y2="350"/>
    <line x1="870" y1="0" x2="870" y2="350"/>
  </g>

  <!-- ================= TOP HEADER BAR ================= -->
  <g transform="translate(35, 36)">
    <circle class="node-beacon" cx="0" cy="0" r="5" fill="#00ff9d" filter="url(#pipe-glow)"/>
    <text class="txt-sans" font-size="13" font-weight="800" fill="#94a3b8" x="16" y="4" letter-spacing="1.5">OPERATOR DIRECTIVE // RAJIV G. RAMTEKE BRIEF INTRODUCTION</text>
    <text class="txt-mono" font-size="10" font-weight="700" fill="#00f3ff" x="760" y="4" letter-spacing="1.5">[ SYSTEM PROFILE // STATUS: ACTIVE ]</text>
  </g>

  <!-- ================= BUS CONNECTING WIRES ================= -->
  <g stroke="#1e293b" stroke-width="3" fill="none">
    <path id="path1" d="M 280,180 L 325,180"/>
    <path id="path2" d="M 560,180 L 605,180"/>
    <path id="path3" d="M 840,180 L 885,180"/>
  </g>

  <!-- Active Glowing Signal Paths -->
  <g stroke="url(#wire-grad-1)" stroke-width="2" fill="none" opacity="0.85">
    <line x1="280" y1="180" x2="325" y2="180"/>
    <line x1="560" y1="180" x2="605" y2="180"/>
    <line x1="840" y1="180" x2="885" y2="180"/>
  </g>

  <!-- ================= ANIMATED TRAVELING DATA PACKETS ================= -->
  <!-- Forward Packets -->
  <circle r="4.5" fill="#00f3ff" filter="url(#pipe-glow)">
    <animateMotion path="M 280,180 L 325,180" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle r="4.5" fill="#00ff9d" filter="url(#pipe-glow)">
    <animateMotion path="M 560,180 L 605,180" dur="1.2s" begin="0.4s" repeatCount="indefinite" />
  </circle>
  <circle r="4.5" fill="#00f3ff" filter="url(#pipe-glow)">
    <animateMotion path="M 840,180 L 885,180" dur="1.2s" begin="0.8s" repeatCount="indefinite" />
  </circle>

  <!-- Return Packets -->
  <circle r="3.5" fill="#ffffff" filter="url(#pipe-glow)">
    <animateMotion path="M 885,180 L 840,180" dur="1.2s" begin="0.2s" repeatCount="indefinite" />
  </circle>
  <circle r="3.5" fill="#00ff9d" filter="url(#pipe-glow)">
    <animateMotion path="M 605,180 L 560,180" dur="1.2s" begin="0.6s" repeatCount="indefinite" />
  </circle>
  <circle r="3.5" fill="#38bdf8" filter="url(#pipe-glow)">
    <animateMotion path="M 325,180 L 280,180" dur="1.2s" begin="1.0s" repeatCount="indefinite" />
  </circle>

  <!-- ================= NODE 1: WHO I AM (IDENTITY) ================= -->
  <g transform="translate(45, 80)">
    <rect width="235" height="200" rx="14" fill="url(#node-box-1)" stroke="#00f3ff" stroke-width="1.5" filter="url(#pipe-glow)"/>
    <rect x="15" y="15" width="22" height="22" rx="6" fill="#032b30"/>
    <text class="txt-mono" font-size="12" font-weight="800" fill="#00f3ff" x="22" y="31">👋</text>
    
    <text class="txt-mono" font-size="9" font-weight="700" fill="#64748b" x="46" y="24" letter-spacing="1">CARD 01</text>
    <text class="txt-sans" font-size="12" font-weight="800" fill="#ffffff" x="46" y="38">IDENTITY &amp; BIO</text>

    <line x1="15" y1="52" x2="220" y2="52" stroke="#1e293b" stroke-width="1"/>

    <g transform="translate(15, 66)" class="txt-mono" font-size="9.5" font-weight="600">
      <rect width="205" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text fill="#00f3ff" x="8" y="15">Rajiv G. Ramteke</text>

      <rect y="30" width="205" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text fill="#38bdf8" x="8" y="45">B.Tech Student</text>

      <rect y="60" width="205" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text fill="#94a3b8" x="8" y="75">SCET Nagpur, India 🇮🇳</text>

      <rect y="90" width="205" height="22" rx="4" fill="#032b30" stroke="#00f3ff" stroke-width="0.5"/>
      <text fill="#00f3ff" x="8" y="105">ROLE: FULL-STACK &amp; AI</text>
    </g>
  </g>

  <!-- ================= NODE 2: CAREER OBJECTIVE ================= -->
  <g transform="translate(325, 80)">
    <rect width="235" height="200" rx="14" fill="url(#node-box-1)" stroke="#00ff9d" stroke-width="1.5" filter="url(#pipe-glow)"/>
    <rect x="15" y="15" width="22" height="22" rx="6" fill="#022c22"/>
    <text class="txt-mono" font-size="12" font-weight="800" fill="#00ff9d" x="21" y="31">🎯</text>
    
    <text class="txt-mono" font-size="9" font-weight="700" fill="#64748b" x="46" y="24" letter-spacing="1">CARD 02</text>
    <text class="txt-sans" font-size="12" font-weight="800" fill="#ffffff" x="46" y="38">CAREER OBJECTIVE</text>

    <line x1="15" y1="52" x2="220" y2="52" stroke="#1e293b" stroke-width="1"/>

    <g transform="translate(15, 66)" class="txt-mono" font-size="9.5" font-weight="600">
      <rect width="205" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text fill="#00ff9d" x="8" y="15">Full-Stack &amp; AI Solutions</text>

      <rect y="30" width="205" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text fill="#38bdf8" x="8" y="45">Solving Real-World Problems</text>

      <rect y="60" width="205" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text fill="#94a3b8" x="8" y="75">SDE / AI @ ImmverseAI</text>

      <rect y="90" width="205" height="22" rx="4" fill="#022c22" stroke="#00ff9d" stroke-width="0.5"/>
      <text fill="#00ff9d" x="8" y="105">STATUS: ACTIVELY SEEKING</text>
    </g>
  </g>

  <!-- ================= NODE 3: ACADEMIC TELEMETRY ================= -->
  <g transform="translate(605, 80)">
    <rect width="235" height="200" rx="14" fill="url(#node-box-1)" stroke="#38bdf8" stroke-width="1.5" filter="url(#pipe-glow)"/>
    <rect x="15" y="15" width="22" height="22" rx="6" fill="#082f49"/>
    <text class="txt-mono" font-size="12" font-weight="800" fill="#38bdf8" x="21" y="31">🎓</text>
    
    <text class="txt-mono" font-size="9" font-weight="700" fill="#64748b" x="46" y="24" letter-spacing="1">CARD 03</text>
    <text class="txt-sans" font-size="12" font-weight="800" fill="#ffffff" x="46" y="38">ACADEMIC PROFILE</text>

    <line x1="15" y1="52" x2="220" y2="52" stroke="#1e293b" stroke-width="1"/>

    <g transform="translate(15, 66)" class="txt-mono" font-size="9.5" font-weight="600">
      <rect width="205" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text fill="#38bdf8" x="8" y="15">Computer Engineering</text>

      <rect y="30" width="205" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text fill="#00ff9d" x="8" y="45">SGPA: 8.74 / 10.0</text>

      <rect y="60" width="205" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text fill="#94a3b8" x="8" y="75">Batch: 2023 – 2027</text>

      <rect y="90" width="205" height="22" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="0.5"/>
      <text fill="#38bdf8" x="8" y="105">SCORE: HIGH DISTINCTION</text>
    </g>
  </g>

  <!-- ================= NODE 4: CORE EXPERTISE ================= -->
  <g transform="translate(885, 80)">
    <rect width="235" height="200" rx="14" fill="url(#node-box-1)" stroke="#00f3ff" stroke-width="1.5" filter="url(#pipe-glow)"/>
    <rect x="15" y="15" width="22" height="22" rx="6" fill="#032b30"/>
    <text class="txt-mono" font-size="12" font-weight="800" fill="#00f3ff" x="21" y="31">⚡</text>
    
    <text class="txt-mono" font-size="9" font-weight="700" fill="#64748b" x="46" y="24" letter-spacing="1">CARD 04</text>
    <text class="txt-sans" font-size="12" font-weight="800" fill="#ffffff" x="46" y="38">CORE EXPERTISE</text>

    <line x1="15" y1="52" x2="220" y2="52" stroke="#1e293b" stroke-width="1"/>

    <g transform="translate(15, 66)" class="txt-mono" font-size="9.5" font-weight="600">
      <rect width="205" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text fill="#00f3ff" x="8" y="15">Python &amp; JS Ecosystems</text>

      <rect y="30" width="205" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text fill="#00ff9d" x="8" y="45">Machine Learning &amp; CV</text>

      <rect y="60" width="205" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text fill="#94a3b8" x="8" y="75">REST APIs &amp; Database Ops</text>

      <rect y="90" width="205" height="22" rx="4" fill="#032b30" stroke="#00f3ff" stroke-width="0.5"/>
      <text fill="#00f3ff" x="8" y="105">SYSTEM: 100% READY</text>
    </g>
  </g>

  <!-- ================= BOTTOM RUNTIME TELEMETRY ================= -->
  <g transform="translate(45, 318)" class="txt-mono" font-size="10" font-weight="700">
    <text fill="#64748b">EMAIL: <tspan fill="#ffffff">RAMTEKERAJIV22@GMAIL.COM</tspan></text>
    <text x="350" fill="#64748b">GITHUB: <tspan fill="#00ff9d">github.com/rajiv-ramteke</tspan></text>
    <text x="650" fill="#64748b">LINKEDIN: <tspan fill="#00f3ff">RAJIV RAMTEKE</tspan></text>
    <text x="920" fill="#64748b">GITHUB: <tspan fill="#00ff9d">@RAJIV-RAMTEKE</tspan></text>
  </g>
</svg>
