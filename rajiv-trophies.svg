<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="100%" height="100%">
  <defs>
    <!-- Card Background -->
    <linearGradient id="trophy-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="50%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <!-- Glass Glow Border -->
    <linearGradient id="trophy-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#00ff9d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Trophy Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&amp;family=Inter:wght@700;800&amp;display=swap');
      .txt-mono { font-family: 'JetBrains Mono', monospace; }
      .txt-sans { font-family: 'Inter', sans-serif; }
    </style>
  </defs>

  <!-- Frame Canvas -->
  <rect width="880" height="170" rx="14" fill="url(#trophy-card-bg)" stroke="url(#trophy-glass)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- ================= TROPHY 1: GOLD COMMITS ================= -->
  <g transform="translate(18, 15)">
    <rect width="156" height="140" rx="10" fill="#090e1c" stroke="#f59e0b" stroke-width="1"/>
    
    <circle cx="78" cy="42" r="22" fill="#241a06" stroke="#f59e0b" stroke-width="1.5"/>
    <text class="txt-mono" font-size="20" x="68" y="49">🏆</text>

    <text class="txt-sans" font-size="10" font-weight="800" fill="#fbbf24" x="78" y="80" text-anchor="middle">CODE ARCHITECT</text>
    
    <rect x="28" y="88" width="100" height="18" rx="4" fill="#382606" stroke="#f59e0b" stroke-width="0.5"/>
    <text class="txt-mono" font-size="9" font-weight="700" fill="#fbbf24" x="78" y="101" text-anchor="middle">RANK: GOLD S</text>

    <text class="txt-mono" font-size="8.5" fill="#94a3b8" x="78" y="123" text-anchor="middle">GitHub Commits</text>
  </g>

  <!-- ================= TROPHY 2: FULL STACK CRAFTSMAN ================= -->
  <g transform="translate(188, 15)">
    <rect width="156" height="140" rx="10" fill="#090e1c" stroke="#00f3ff" stroke-width="1"/>
    
    <circle cx="78" cy="42" r="22" fill="#032b30" stroke="#00f3ff" stroke-width="1.5"/>
    <text class="txt-mono" font-size="20" x="68" y="49">⚡</text>

    <text class="txt-sans" font-size="10" font-weight="800" fill="#00f3ff" x="78" y="80" text-anchor="middle">FULL STACK MASTER</text>
    
    <rect x="28" y="88" width="100" height="18" rx="4" fill="#0c4a6e" stroke="#00f3ff" stroke-width="0.5"/>
    <text class="txt-mono" font-size="9" font-weight="700" fill="#00f3ff" x="78" y="101" text-anchor="middle">RANK: S CLASS</text>

    <text class="txt-mono" font-size="8.5" fill="#94a3b8" x="78" y="123" text-anchor="middle">Python / React / API</text>
  </g>

  <!-- ================= TROPHY 3: AI & CV SPECIALIST ================= -->
  <g transform="translate(358, 15)">
    <rect width="156" height="140" rx="10" fill="#090e1c" stroke="#00ff9d" stroke-width="1"/>
    
    <circle cx="78" cy="42" r="22" fill="#022c22" stroke="#00ff9d" stroke-width="1.5"/>
    <text class="txt-mono" font-size="20" x="68" y="49">🧠</text>

    <text class="txt-sans" font-size="10" font-weight="800" fill="#00ff9d" x="78" y="80" text-anchor="middle">AI &amp; VISION SPECS</text>
    
    <rect x="28" y="88" width="100" height="18" rx="4" fill="#064e3b" stroke="#00ff9d" stroke-width="0.5"/>
    <text class="txt-mono" font-size="9" font-weight="700" fill="#00ff9d" x="78" y="101" text-anchor="middle">RANK: S CLASS</text>

    <text class="txt-mono" font-size="8.5" fill="#94a3b8" x="78" y="123" text-anchor="middle">OpenCV / YOLO / ML</text>
  </g>

  <!-- ================= TROPHY 4: ACADEMIC EXCELLENCE ================= -->
  <g transform="translate(528, 15)">
    <rect width="156" height="140" rx="10" fill="#090e1c" stroke="#c084fc" stroke-width="1"/>
    
    <circle cx="78" cy="42" r="22" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.5"/>
    <text class="txt-mono" font-size="20" x="68" y="49">🎓</text>

    <text class="txt-sans" font-size="10" font-weight="800" fill="#c084fc" x="78" y="80" text-anchor="middle">ACADEMIC MASTER</text>
    
    <rect x="28" y="88" width="100" height="18" rx="4" fill="#581c87" stroke="#c084fc" stroke-width="0.5"/>
    <text class="txt-mono" font-size="9" font-weight="700" fill="#c084fc" x="78" y="101" text-anchor="middle">SGPA: 8.74 / 10</text>

    <text class="txt-mono" font-size="8.5" fill="#94a3b8" x="78" y="123" text-anchor="middle">B.Tech CSE @ SCET</text>
  </g>

  <!-- ================= TROPHY 5: PROBLEM SOLVER ================= -->
  <g transform="translate(698, 15)">
    <rect width="156" height="140" rx="10" fill="#090e1c" stroke="#f43f5e" stroke-width="1"/>
    
    <circle cx="78" cy="42" r="22" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5"/>
    <text class="txt-mono" font-size="20" x="68" y="49">🎯</text>

    <text class="txt-sans" font-size="10" font-weight="800" fill="#f43f5e" x="78" y="80" text-anchor="middle">HIGH IMPACT DEV</text>
    
    <rect x="28" y="88" width="100" height="18" rx="4" fill="#881337" stroke="#f43f5e" stroke-width="0.5"/>
    <text class="txt-mono" font-size="9" font-weight="700" fill="#f43f5e" x="78" y="101" text-anchor="middle">IMMVERSEAI READY</text>

    <text class="txt-mono" font-size="8.5" fill="#94a3b8" x="78" y="123" text-anchor="middle">DSA &amp; Hackathons</text>
  </g>
</svg>
